name: Daily FPSO Crawler — All 15 Adapters

on:
  schedule:
    # 北京时间每天早上 8:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run all 15 adapters (continue-on-error per adapter)
        run: python crawler/crawl.py

      - name: Auto-classify (standalone fallback)
        continue-on-error: true
        run: python crawler/crawl.py --auto-classify

      - name: Auto-ingest + notify (standalone fallback)
        continue-on-error: true
        run: python crawler/crawl.py --auto-ingest

      - name: Backfill canonical_project_id (one-time fix for existing data)
        continue-on-error: true
        run: python crawler/crawl.py --backfill-canonical-ids
